# Tessera runtime guardrail policy.
#
# This file is the canonical, auditable description of what tools the agent
# may invoke, under what conditions, and what redactions to apply. It is
# read at start-up by tessera.guard.adapter and re-read on SIGHUP.
#
# Schema:
#   version: integer, bumped on every breaking change.
#   tools:
#     <tool_name>:
#       allow: bool                       # default: false
#       requires_confirmation: bool       # require explicit user re-ask
#       require_languages: [fr, de, en]   # restrict invocation to listed langs
#       max_calls_per_turn: int           # default: 1
#       arguments:                        # per-argument validation
#         <arg_name>:
#           pattern: regex                # value must match
#           redact_in_audit: bool         # mask value in the audit trail
#   prompt_injection:
#     deny_patterns: [regex, ...]
#     transform_patterns:
#       - match: regex
#         replacement: string
#   pii:
#     redact_patterns: [regex, ...]       # applied to all tool inputs/outputs

version: 1

tools:
  account_balance:
    allow: true
    requires_confirmation: false
    max_calls_per_turn: 2
    arguments:
      customer_id:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        redact_in_audit: true

  card_block:
    allow: true
    requires_confirmation: true
    max_calls_per_turn: 1
    arguments:
      customer_id:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        redact_in_audit: true
      card_last_four:
        pattern: "^[0-9]{4}$"
        redact_in_audit: false
      reason:
        pattern: "^(lost|stolen|fraud_suspected|customer_request)$"
        redact_in_audit: false

  transaction_search:
    allow: true
    requires_confirmation: false
    max_calls_per_turn: 3
    arguments:
      customer_id:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        redact_in_audit: true

  loan_simulate:
    allow: true
    requires_confirmation: false
    max_calls_per_turn: 5
    arguments:
      amount:
        # Max 10M EUR — rejects aberrant values like 1 000 000 000
        pattern: "^[0-9]{1,7}(\\.[0-9]{1,2})?$"
        redact_in_audit: false
      years:
        pattern: "^([1-9]|[12][0-9]|30)$"
        redact_in_audit: false

  ticket_escalate:
    allow: true
    requires_confirmation: false
    max_calls_per_turn: 1
    arguments:
      transcript_excerpt:
        redact_in_audit: true

# Patterns that mark the user's input as adversarial. ``deny_patterns`` reject
# the turn entirely; ``transform_patterns`` strip the offending substring.
prompt_injection:
  deny_patterns:
    # Encoded / obfuscated injection
    - "(?i)(base64|decode|atob|btoa|eval|exec).*instruction"
    - "[A-Za-z0-9+/]{30,}={0,2}"   # raw base64 blob ≥ 30 chars
    # English
    - "(?i)ignore (all previous|all|previous|the above) instructions"
    - "(?i)you are now (a |an |the )?(new |different )?(assistant|system|agent)"
    - "(?i)reveal (your|the) system prompt"
    - "(?i)disregard (the|your) (rules|policy|guardrails)"
    # French
    - "(?i)ignore[sz]? (toutes? les?|les?) instructions? (pr[eé]c[eé]dentes?|ci-dessus|ant[eé]rieures?)"
    - "(?i)tu es (maintenant |d[eé]sormais )?(un |une |le |la )?(nouvel?le? )?(assistant|syst[eè]me|agent)"
    - "(?i)r[eé]v[eè]le[sz]? (ton|votre|le) (prompt syst[eè]me|syst[eè]me prompt)"
    - "(?i)ignore[sz]? (tes|vos) (r[eè]gles?|politiques?|instructions?|contraintes?)"
    # German
    - "(?i)ignorier(e|st)? (alle? (vorherigen?|vorigen?|bisherigen?)|die obigen?) (Anweisungen?|Regeln?|Instruktionen?)"
    - "(?i)du bist (jetzt |nun )?(ein |eine |der |die |das )?(neuer? )?(Assistent|System|Agent)"
    - "(?i)(zeig|offenbar|enthüll)(e|st)? (dein(en?)?|das) (System[- ]?Prompt|Systemprompt)"
    - "(?i)missachte (dein(e|en)?) (Regeln?|Richtlinien?|Anweisungen?)"
  transform_patterns:
    - match: "(?i)\\b(act as|pretend to be|roleplay as)\\b[^.]*\\."
      replacement: "[redacted role-play attempt]"
    - match: "(?i)\\b(fais semblant d'être|joue le rôle de|comporte-toi comme)\\b[^.]*\\."
      replacement: "[tentative de jeu de rôle redactée]"
    - match: "(?i)\\b(tu es|tu dois être|agis comme)\\b[^.]*\\."
      replacement: "[instruction de rôle redactée]"
    - match: "(?i)\\b(sei|spiele|tu so als ob du)\\b[^.]*\\."
      replacement: "[Rollenspielversuch geschwärzt]"

# Patterns that constitute personal data and must be masked from logs and
# from arguments echoed back to the LLM.
pii:
  redact_patterns:
    # Email
    - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    # IBAN (FR/DE/AT/BE/NL/IT/ES, basic shape — full check at the tool layer)
    - "(?i)[A-Z]{2}[0-9]{2}[A-Z0-9 ]{11,30}"
    # 16-digit PAN
    - "\\b(?:\\d[ -]?){13,19}\\b"
    # French phone number
    - "\\b(?:\\+33|0)[1-9](?:[ .-]?[0-9]{2}){4}\\b"
    # German phone number
    - "\\b(?:\\+49|0)[1-9][0-9]{1,4}[ /-]?[0-9]{3,10}\\b"
