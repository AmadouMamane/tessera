# Tessera on-prem edge gateway (ADR 0008, premium tier).
#
# This is the EDGE rate-limiting + TLS-termination layer that sits in front of
# the agent on the self-hosted path, where there is no managed load balancer.
# It is defence in depth, NOT a replacement for the app-level limiter:
#
#   * Edge (this file): volumetric protection, keyed by client IP, plus TLS,
#     connection limits, and basic request hygiene — stops floods before they
#     ever reach Python.
#   * App  (tessera.api.ratelimit): per-identity (bearer-token) fairness and
#     LLM-cost-aware limits on /chat — close to the expensive resource.
#
# Kong is a drop-in alternative for teams already running it: the equivalent is
# the `rate-limiting` plugin (policy=redis) on the /chat route plus `bot-detection`
# and `ip-restriction`. We ship nginx because it has zero control-plane to run.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Rate-limit zones ---------------------------------------------------
    # Two buckets keyed by client IP: a strict one for the LLM endpoint and a
    # looser one for everything else. 10m of shared memory ~ 160k IPs.
    limit_req_zone  $binary_remote_addr zone=chat:10m  rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=read:10m  rate=120r/m;
    # Cap concurrent connections per IP — slow-loris / socket exhaustion guard.
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    # Reject oversized bodies at the edge too (mirrors api.max_request_bytes).
    client_max_body_size 256k;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Return 429 so clients get a consistent shape with the app layer.
    limit_req_status 429;
    limit_conn_status 429;

    # Trust only the immediate proxy for X-Forwarded-For (set to your real CIDR).
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    upstream tessera_agent {
        server agent:8080;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS — mount real certs in production; self-signed for local premium dev.
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        limit_conn conns 20;

        # Common proxy headers.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Strict bucket for the expensive streaming endpoint. SSE needs buffering
        # off and a long read timeout for streamed tokens.
        location = /chat {
            limit_req zone=chat burst=5 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://tessera_agent;
        }

        # Liveness/readiness must never be throttled.
        location = /healthz { proxy_pass http://tessera_agent; }
        location = /readyz  { proxy_pass http://tessera_agent; }

        # Everything else gets the looser bucket.
        location / {
            limit_req zone=read burst=20 nodelay;
            proxy_pass http://tessera_agent;
        }
    }

    # Redirect plain HTTP to HTTPS.
    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }
}
